{% extends 'base.html' %}

{% block title %}Add Question{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="h3">Add Question to Exercise: {{ exercise.title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Question</button>
        <a href="{% url 'activities:exercise_detail'  exercise.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
