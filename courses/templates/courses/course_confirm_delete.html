{% extends 'base_confirm_delete.html' %}
{% block content %}
<div class="dialog-overlay">
  <div class="dialog-box">
    <h2>Delete Confirmation</h2>
    <p>Are you sure you want to delete this <strong>{{ model|lower }}</strong> named <strong>{{ object_name }}</strong>?</p>
    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{% url 'courses:course_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>

<style>
  /* Overlay to dim background */
  .dialog-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  /* Dialog box styling */
  .dialog-box {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    width: 400px;
    padding: 20px;
    text-align: center;
  }

  .dialog-box h2 {
    margin: 0 0 15px;
    font-size: 1.5em;
  }

  .dialog-box p {
    margin-bottom: 20px;
    font-size: 1em;
  }

  .dialog-box .btn {
    margin: 0 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    font-size: 1em;
    cursor: pointer;
  }

  .btn-danger {
    background: #dc3545;
    color: #fff;
  }

  .btn-danger:hover {
    background: #c82333;
  }

  .btn-secondary {
    background: #6c757d;
    color: #fff;
    text-decoration: none;
    display: inline-block;
    padding: 10px 15px;
  }

  .btn-secondary:hover {
    background: #5a6268;
  }
</style>
{% endblock %}
