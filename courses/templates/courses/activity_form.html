{% extends 'base_form.html' %}
{% block header %}
<h5>Add Activity </h5>
{% endblock %}
{% block content %}


{% load crispy_forms_tags %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-sucess text-dark">
                    <h5 class="mb-0">Create / Update {{ model|capfirst }}</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="mt-3 text-end">
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
