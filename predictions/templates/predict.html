{% extends 'base_list.html' %}
{% block content %}
    <h1>Predict Final Grade</h1>

    <form method="POST" action="{% url 'predict_grade' %}">
        {% csrf_token %}
        <label>Assessment Score:</label>
        <input type="number" step="0.01" name="assessment_score" required><br>

        <label>Industry Training Experience:</label>
        <input type="number" step="0.01" name="Industry_Training_Experience" required><br>

        <label>Average Time Per Task:</label>
        <input type="number" step="0.01" name="Average_Time_Per_Task" required><br>

        <label>Completed No Activity:</label>
        <input type="number" step="0.01" name="Completed_No_Activity" required><br>

        <label>Total Task Completed:</label>
        <input type="number" step="0.01" name="Total_Task_Completed" required><br>

        <label>Self-Efficacy Score:</label>
        <input type="number" step="0.01" name="Self_Efficacy_Score" required><br>

        <label>Practical Hours:</label>
        <input type="number" step="0.01" name="Practicals_hrs" required><br>

        <label>Theory Hours:</label>
        <input type="number" step="0.01" name="Theory_hrs" required><br>

        <button type="submit">Predict</button>
    </form>

    <!-- Display the prediction result -->
    {% if prediction %}
        <h2>Prediction Result: {{ prediction }}</h2>
    {% endif %}
{% endblock %}
