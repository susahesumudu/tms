<div class="container-fluid">
    {% if user.is_authenticated %}
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center link-light text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                {% if profile and profile.avatar %}
                    <img src="{{ profile.avatar.url }}" alt="Avatar" width="36" height="36" class="rounded-circle me-2">
                {% else %}
                    <img src="https://via.placeholder.com/32" alt="Default Avatar" width="32" height="32" class="rounded-circle me-2">
                {% endif %}
            </a>
            <ul class="dropdown-menu text-small shadow dropdown-menu-end bg-dark" aria-labelledby="dropdownUser">
                <li>
                    <a class="dropdown-item text-light d-flex align-items-center" href="{% url 'dashboard' %}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a class="dropdown-item text-light d-flex align-items-center" href="{% url 'profile_detail' %}">
                        <i class="bi bi-person-circle me-2"></i> Profile
                    </a>
                </li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li>
                    <a class="dropdown-item text-light d-flex align-items-center" href="{% url 'logout' %}">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    {% endif %}
</div>
